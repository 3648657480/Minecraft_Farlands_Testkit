allprojects {
    group = 'com.farlands'
    // Single version authority: the VERSION file at the repository root.
    // It flows into fabric.mod.json (processResources), the jar name, and the
    // runtime banner (read back from mod metadata) - and every doc refers to it.
    version = rootProject.file('VERSION').text.trim()

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

plugins {
    id 'java'
    id 'maven-publish'
}

// fabric-loom is provided by buildSrc (needed there for the jar processor
// API), so it is applied without a version.
apply plugin: 'fabric-loom'

base { archivesName = 'farlands-g1-mod' }

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered { mappings file(rootProject.file('mappings.tiny')) }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "com.mojang:brigadier:1.3.10"
}

loom {
    runtimeOnlyLog4j = true
    // F0 bisection: -Dfarlands.patch=false runs the mod on an unpatched jar.
    if (System.getProperty('farlands.patch') != 'false') {
        addMinecraftJarProcessor(com.farlands.g1.loom.G1JarProcessor)
    }
    runConfigs {
        server {
            // Forward every farlands.* system property to the run JVM so
            // experiments can override config keys without editing files.
            System.getProperties().each { key, value ->
                String k = key.toString()
                if (k.startsWith('farlands.')) {
                    property k, value.toString()
                }
            }
        }
        client {
            System.getProperties().each { key, value ->
                String k = key.toString()
                if (k.startsWith('farlands.')) {
                    property k, value.toString()
                }
            }
            if (System.getProperty('farlands.testgen') != null) {
                programArg '--quickPlaySingleplayer'
                programArg 'Test World'
            }
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// E2: offline save translator (shift all chunks by a chunk delta).
// Usage: gradlew :mod:translateSave -Pworld=<path> -Pdx=<chunks> -Pdz=<chunks>
// F0: world-diff evidence tool (compare two worlds chunk by chunk).
// Usage: gradlew :mod:worldDiff -PworldA=<path> -PworldB=<path> [-Preport=<file>]
sourceSets {
    main {
        java {
            srcDir '../tools/chunk-translator/src'
            srcDir '../tools/world-diff/src'
        }
    }
}
tasks.register('worldDiff', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'farlands.worlddiff.Main'
    if (project.hasProperty('worldA')) args project.property('worldA')
    if (project.hasProperty('worldB')) args project.property('worldB')
    if (project.hasProperty('report')) args project.property('report')
    workingDir = rootProject.projectDir
}
tasks.register('translateSave', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'farlands.translator.Main'
    if (project.hasProperty('world')) args project.property('world')
    if (project.hasProperty('dx')) args project.property('dx')
    if (project.hasProperty('dz')) args project.property('dz')
    workingDir = rootProject.projectDir
}
